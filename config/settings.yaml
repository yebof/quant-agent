api_keys:
  anthropic: "${ANTHROPIC_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  deepseek: "${DEEPSEEK_API_KEY}"   # optional; required only if any *_model is a deepseek-* id
  fred: "${FRED_API_KEY}"
  alpaca_key: "${ALPACA_API_KEY}"
  alpaca_secret: "${ALPACA_SECRET_KEY}"

alpaca:
  base_url: "https://paper-api.alpaca.markets"  # paper trading
  paper: true

llm:
  tech_analyst_model: "gpt-5.5"
  news_analyst_model: "gpt-5.5"
  macro_analyst_model: "gpt-5.5"
  earnings_analyst_model: "gpt-5.5"
  portfolio_manager_model: "gpt-5.5"
  risk_manager_model: "gpt-5.5"
  position_reviewer_model: "gpt-5.5"
  evening_analyst_model: "gpt-5.5"
  # Global fallback — any per-agent override below takes precedence.
  max_tokens: 128000
  # Per-agent caps. Set generously so no agent silently truncates: PM and
  # Evening emit the heaviest outputs (7-step / 6-step CoT + many list fields);
  # Macro is the lightest. Leave `null` to inherit `max_tokens` above.
  tech_analyst_max_tokens: 128000
  news_analyst_max_tokens: 128000
  macro_analyst_max_tokens: 128000
  earnings_analyst_max_tokens: 128000
  portfolio_manager_max_tokens: 128000
  risk_manager_max_tokens: 128000
  position_reviewer_max_tokens: 128000
  evening_analyst_max_tokens: 128000
  # Meta-reflector runs once per quarter (--mode meta). Dense digest input
  # + structured QuarterlyMetaReflection output; gpt-5.5 by default.
  meta_reflector_model: "gpt-5.5"
  meta_reflector_max_tokens: 128000

risk:
  max_position_pct: 20
  max_total_position_pct: 90
  max_daily_loss_pct: 3
  max_sector_pct: 40
  require_stop_loss: true
  # Cash-only by default. Flip to true to allow margin — BUYs can then spend
  # beyond available cash. When false (default) the risk engine hard-blocks
  # any BUY that would drive cash negative, and the PM + midday prompts get
  # a mandatory de-lever directive when cash is already negative.
  allow_margin: false

# Idle-cash sweep — park cash above the reserve in a T-bill ETF, release it
# automatically before BUYs. The vehicle is cash-equivalent everywhere:
# hidden from every LLM view, counted as cash by the risk engine, stopless
# by design, first to liquidate in force_delever. Deterministic, zero-LLM.
# (2026-07-16 forensics: ~84% idle cash for weeks = ~$300/mo risk-free carry
# left on the table; see src/execution/cash_sweep.py.)
cash_sweep:
  enabled: true
  symbol: "SGOV"        # iShares 0-3mo T-bills; BIL is the fallback choice
  reserve_pct: 1.0      # % of equity kept as raw cash for fees/slippage
  min_order_usd: 500    # don't churn sub-$500 parking orders

# Regime-conditional core beta sleeve (2026-09-23; src/execution/core_beta.py).
# While the single-name book is under its deployment target and macro says
# risk-on, the gap is filled with SPY instead of T-bills. Rule-managed at the
# session bookends: hidden from every LLM view, credited as fundable cash,
# sold first to fund single-name BUYs, halved in drawdown, never traded on a
# daily-loss-breach day, held (no trades) when the macro snapshot is stale.
# Forensics 04-08→09-21: NAV +5.4% vs SPY +15.0%, avg cash 58%, beta 0.30;
# parking idle cash in SPY on those days would have added +7.6pp.
core_beta:
  enabled: true
  symbol: "SPY"
  target_deployment_pct: 75   # fallback; macro position_guidance.target_invested_pct wins
  regime_fraction:
    risk-on: 1.0
    neutral: 0.5
    transitional: 0.5
    risk-off: 0.0
  max_weight_pct: 60
  rebalance_band_pct: 7.5     # > the 5pp quantum macro's target_invested_pct wobbles in
  min_order_usd: 500
  max_regime_age_days: 5
  drawdown_multiplier: 0.5

